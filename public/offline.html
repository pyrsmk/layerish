<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Layerish — Hors ligne</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: #0b0b0f;
        color: #f5f6fa;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        max-width: 420px;
        padding: 24px;
        background: #14141a;
        border: 1px solid #1f2028;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #b7bac7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Tu es hors ligne</h1>
      <p>Reviens en ligne pour charger l’application.</p>
    </div>
  </body>
</html>
